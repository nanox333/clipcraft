[advisories]
version = 2
# Crates their authors have stopped maintaining, reached only through other crates we cannot move
# yet. None is a known vulnerability. Revisit when eframe or zbus (the portal and shortcut code uses
# its blocking API, which zbus 6 removed) move on.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; transitive through the graphics stack" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; transitive through the font stack" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; we use zbus 5's blocking API" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; we use zbus 5's blocking API" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; we use zbus 5's blocking API" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]

# MPL-2.0 is allowed only for these crates, used unmodified, because FilmCraft's media hub depends
# on them for MP3/FLAC/Vorbis/AAC audio decoding (docs/adr/0005-mpl-symphonia-exception.md).
exceptions = [
    # CC0 public-domain dedication/fallback permission for Naga's hex-float parser only;
    # exact reviewed registry package, not a global license-policy expansion (ADR 0026).
    { allow = ["CC0-1.0"], crate = "hexf-parse@0.2.1" },
    { allow = ["MPL-2.0"], crate = "symphonia" },
    { allow = ["MPL-2.0"], crate = "symphonia-bundle-flac" },
    { allow = ["MPL-2.0"], crate = "symphonia-bundle-mp3" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-aac" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-alac" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-pcm" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-vorbis" },
    { allow = ["MPL-2.0"], crate = "symphonia-core" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-isomp4" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-ogg" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-riff" },
    { allow = ["MPL-2.0"], crate = "symphonia-metadata" },
    { allow = ["MPL-2.0"], crate = "symphonia-utils-xiph" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# FilmCraft crates, pinned by commit in the workspace manifest (docs/adr/0004).
allow-git = ["https://github.com/storytold/filmcraft"]
