name: Release

# Builds the Linux and Windows downloads and puts them on a draft GitHub Release.
# Start it by pushing a tag such as v0.1.0 (it must match the version in Cargo.toml), or run it by
# hand from the Actions tab. The downloads are not code-signed; see docs/release-checklist.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read the version from Cargo.toml
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::no version found in Cargo.toml"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  package:
    env:
      CLIPCRAFT_DISCORD_APPLICATION_ID: ${{ vars.CLIPCRAFT_DISCORD_APPLICATION_ID }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers (Linux sound output)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Rust license checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Build the package
        run: cargo xtask package
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
            target/dist/ClipCraft-Setup-*.exe
          if-no-files-found: error

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # The private release key (see docs/release-checklist.md). Without it the release is built
      # as before, unsigned.
      CLIPCRAFT_SIGNING_KEY: ${{ secrets.CLIPCRAFT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: package-*
          merge-multiple: true
      # Two releases from one build: the app (setup program, portable zip, Linux tarball) on
      # v<version>, and the command line tool on its own on cli-v<version>.
      - name: Sort the downloads into app and command line folders
        run: |
          mkdir dist/app dist/cli
          mv dist/clipcraft-cli-* dist/cli/
          mv dist/clipcraft-* dist/ClipCraft-* dist/app/
          for folder in app cli; do
            (cd "dist/$folder" && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          done
      - uses: dtolnay/rust-toolchain@stable
        if: env.CLIPCRAFT_SIGNING_KEY != ''
      - name: Sign the checksums
        if: env.CLIPCRAFT_SIGNING_KEY != ''
        run: |
          cargo xtask sign dist/app/SHA256SUMS.txt
          cargo xtask sign dist/cli/SHA256SUMS.txt
      - name: Create or refresh the draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          app_notes="docs/releases/v${VERSION}.md"
          if [ ! -f "$app_notes" ]; then
            echo "::error::missing release notes: $app_notes"
            exit 1
          fi
          cli_notes="$RUNNER_TEMP/cli-notes.md"
          cat > "$cli_notes" <<EOF
          The ClipCraft command line tool ${VERSION}, on its own: list capture targets, record, trim,
          export and inspect your library from a terminal. Run it with \`help\`, and \`diagnose\` if
          recording does not work.

          This is not the app. The ClipCraft app (setup program and portable zip for Windows, tarball
          for Linux) is on the [v${VERSION} release](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}).
          Check your download against \`SHA256SUMS.txt\` first.
          EOF
          # Publish the command line release first and the app release last: the app's update
          # check reads the repository's latest release, which must stay the app.
          publish() {
            tag="$1"; title="$2"; notes="$3"; folder="$4"; latest="$5"
            if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
              if [ "$draft" != true ]; then
                echo "::error::refusing to overwrite a published release ($tag)"
                exit 1
              fi
              # A draft has no tag until it is published. If a tag exists it must be this build's
              # commit; if not, the draft is simply refreshed from this build.
              if tagged_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha 2>/dev/null); then
                if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
                  echo "::error::release tag $tag points to $tagged_commit, but packages were built from $GITHUB_SHA"
                  exit 1
                fi
              else
                gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
              fi
              # Files from an earlier build of the draft that this build no longer makes.
              for asset in $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
                if [ ! -e "$folder/$asset" ]; then
                  gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --yes
                fi
              done
              gh release upload "$tag" "$folder"/* --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file "$notes" --latest="$latest"
            else
              gh release create "$tag" "$folder"/* \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "$title" \
                --notes-file "$notes" \
                --latest="$latest" \
                --draft
            fi
          }
          publish "cli-v${VERSION}" "ClipCraft command line ${VERSION}" "$cli_notes" dist/cli false
          publish "v${VERSION}" "ClipCraft ${VERSION}" "$app_notes" dist/app true
