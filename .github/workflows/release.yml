name: Release

# Builds the Linux and Windows downloads and puts them on a draft GitHub Release.
# Start it by pushing a tag such as v0.1.0 (it must match the version in Cargo.toml), or run it by
# hand from the Actions tab. The downloads are not code-signed; see docs/release-checklist.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read the version from Cargo.toml
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::no version found in Cargo.toml"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  package:
    env:
      CLIPCRAFT_DISCORD_APPLICATION_ID: ${{ vars.CLIPCRAFT_DISCORD_APPLICATION_ID }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers (Linux sound output)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Rust license checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Build the package
        run: cargo xtask package
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
            target/dist/ClipCraft-Setup-*.exe
          if-no-files-found: error

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: package-*
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum clipcraft-* ClipCraft-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          notes="docs/releases/${tag}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::missing release notes: $notes"
            exit 1
          fi
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::refusing to overwrite a published release"
              exit 1
            fi
            tagged_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "::error::release tag points to $tagged_commit, but packages were built from $GITHUB_SHA"
              exit 1
            fi
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "ClipCraft ${VERSION}" --notes-file "$notes"
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ClipCraft ${VERSION}" \
              --notes-file "$notes" \
              --draft
          fi
