name: Windows probe (temporary)
on:
  push:
    branches: ["claude/**"]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Probe
        run: cargo run -p clipcraft-platform --example win_probe
        continue-on-error: true
      - name: The failing test, alone
        run: cargo test -p clipcraft --bin clipcraft forcing_window_capture -- --nocapture --test-threads=1
        continue-on-error: true
