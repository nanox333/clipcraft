name: Rust quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ALSA headers (Linux sound output)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Rust license checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Run canonical gate
        run: cargo xtask ci
      - name: Require feature documentation updates
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: cargo xtask docs-check "$BASE_REF"
      - name: Require documentation updates on main pushes
        if: github.event_name == 'push'
        shell: bash
        env:
          BASE_REF: ${{ github.event.before }}
        run: cargo xtask docs-check "$BASE_REF"
