[package]
name = "filmcraft-bitstream"
description = "Bit-level reader and writer used by the vendored H.264 encoder (copied from FilmCraft)"
version = "0.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.clipcraft]
layer = 0

[dependencies]

[dev-dependencies]
proptest = "1"

# FilmCraft's own lint settings, so the copied code builds as it did upstream. `unsafe` stays
# forbidden. Tighten these as the code is improved here.
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
