[package]
name = "clipcraft-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Operating-system capture providers and global hotkeys behind a safe interface"

[package.metadata.clipcraft]
layer = 5

[dependencies]
clipcraft-capture.workspace = true
clipcraft-time.workspace = true
clipcraft-record.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.14", default-features = false, features = ["randr"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
global-hotkey = "0.9"

[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
x11rb = { version = "0.14" }

[target.'cfg(any(windows, all(target_os = "linux", target_pointer_width = "64"), target_os = "macos"))'.dependencies]
filmcraft-platform.workspace = true
filmcraft-export.workspace = true
filmcraft-time.workspace = true
filmcraft-isobmff.workspace = true

[lints]
workspace = true
