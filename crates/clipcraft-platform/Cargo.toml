[package]
name = "clipcraft-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Operating-system capture providers and global hotkeys behind a safe interface"

[package.metadata.clipcraft]
layer = 5

# windows::core::implement expands to absolute ::windows_core references on Windows.
[package.metadata.cargo-machete]
ignored = ["windows-core"]

[dependencies]
clipcraft-engine.workspace = true
serde_json.workspace = true
clipcraft-capture.workspace = true
clipcraft-time.workspace = true
clipcraft-record.workspace = true
sysinfo.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.14", default-features = false, features = ["randr", "shm"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
libloading.workspace = true
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
interprocess = "=2.4.6"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Com_StructuredStorage",
] }
windows-capture = "2.0.1"
global-hotkey = "0.9"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
native-tls = "0.2"

[target.'cfg(unix)'.dependencies]
socket2 = "0.6"

[dev-dependencies]
filmcraft-h264.workspace = true
filmcraft-h264enc.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
x11rb = { version = "0.14" }

[target.'cfg(any(windows, all(target_os = "linux", target_pointer_width = "64"), target_os = "macos"))'.dependencies]
filmcraft-platform.workspace = true
filmcraft-codecs.workspace = true
filmcraft-export.workspace = true
filmcraft-time.workspace = true
filmcraft-isobmff.workspace = true

[lints]
workspace = true
