[workspace]
members = [
    "apps/clipcraft",
    "apps/clipcraft-cli",
    "crates/clipcraft-capture",
    "crates/clipcraft-engine",
    "crates/clipcraft-export",
    "crates/clipcraft-frame",
    "crates/clipcraft-media",
    "crates/clipcraft-platform",
    "crates/clipcraft-player",
    "crates/clipcraft-record",
    "crates/clipcraft-audio-out",
    "crates/clipcraft-time",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false

[workspace.dependencies]
clipcraft-capture = { path = "crates/clipcraft-capture" }
clipcraft-engine = { path = "crates/clipcraft-engine" }
clipcraft-export = { path = "crates/clipcraft-export" }
clipcraft-frame = { path = "crates/clipcraft-frame" }
clipcraft-time = { path = "crates/clipcraft-time" }
clipcraft-media = { path = "crates/clipcraft-media" }
clipcraft-platform = { path = "crates/clipcraft-platform" }
clipcraft-record = { path = "crates/clipcraft-record" }
clipcraft-player = { path = "crates/clipcraft-player" }
clipcraft-audio-out = { path = "crates/clipcraft-audio-out" }
cpal = "0.16"
# Offline microphone RNNoise; no CLI, C API, resampling or training dependencies (ADR 0028).
nnnoiseless = { version = "=0.5.2", default-features = false }
# FilmCraft crates are consumed as git dependencies pinned to one commit (docs/adr/0004).
filmcraft-text = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
filmcraft-time = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
gif = { version = "0.14", default-features = false, features = ["std", "color_quant"] }
filmcraft-edit = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
filmcraft-project = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
filmcraft-codecs = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
filmcraft-media = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
filmcraft-h264 = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
filmcraft-h264enc = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
filmcraft-audio-dsp = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
filmcraft-frame = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
filmcraft-color = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
filmcraft-aac = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
filmcraft-matroska = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
filmcraft-platform = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
filmcraft-export = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
filmcraft-isobmff = { git = "https://github.com/storytold/filmcraft", rev = "6c3948a36c80e4996d924766ba7157eec4fca85e" }
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs4 = "1.1"
libloading = "0.8"
tray-icon = { version = "0.26", default-features = false }
rfd = { version = "0.17.2", default-features = true }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Newer clippy suggests `as_chunks` for every constant-size `chunks_exact`. The pixel loops read
# clearly with `chunks_exact`, and rewriting tested hot loops for style is not worth the risk.
chunks_exact_to_as_chunks = "allow"

# Dependencies are optimised even in dev builds: decoding video unoptimised is far slower than real
# time. Codec and pixel-conversion hot loops get the highest level, as in FilmCraft's own manifest.
[profile.dev.package."*"]
opt-level = 2

# Our own audio and video hot loops (decode glue, time stretch) also need optimising in dev builds.
[profile.dev.package.clipcraft-player]
opt-level = 3

[profile.dev.package.clipcraft-export]
opt-level = 3

[profile.dev.package.filmcraft-h264]
opt-level = 3

[profile.dev.package.filmcraft-h264enc]
opt-level = 3

[profile.dev.package.filmcraft-vp8]
opt-level = 3

[profile.dev.package.filmcraft-vp9]
opt-level = 3

[profile.dev.package.filmcraft-aac]
opt-level = 3

[profile.dev.package.filmcraft-codecs]
opt-level = 3

[profile.dev.package.filmcraft-frame]
opt-level = 3

[profile.dev.package.filmcraft-color]
opt-level = 3
